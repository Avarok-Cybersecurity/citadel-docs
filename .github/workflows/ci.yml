name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests, docs, file lengths
    runs-on: ubuntu-latest
    env:
      # Full debug info in every test binary filled the runner's disk ("No space left on
      # device" after the tests step); line tables keep panic locations and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned by rust-toolchain.toml; this only installs the components.
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (pedantic, -D warnings, every target and feature)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: clippy and tests of cdoc-wasm per artefact feature set, and the core alone
        run: |
          set -euo pipefail
          cargo clippy -p cdoc-wasm --all-targets --no-default-features -- -D warnings
          cargo test -p cdoc-wasm --no-default-features
          awk '!/^#/ && NF { print $2 }' crates/cdoc-wasm/artefacts.txt | while read -r feature; do
            cargo clippy -p cdoc-wasm --all-targets --no-default-features --features "$feature" -- -D warnings
            cargo test -p cdoc-wasm --no-default-features --features "$feature"
          done
      - name: tests
        run: cargo test --workspace --all-features
      - name: docs build without warnings
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: file lengths
        run: scripts/check-file-length.sh

  wasm:
    name: wasm32 build and dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: dependency gate (no C, no I/O, no randomness or clock)
        run: scripts/dep-gate.sh
      - name: build cdoc-crdt for wasm32-unknown-unknown
        run: cargo build --locked -p cdoc-crdt --target wasm32-unknown-unknown --release
      - uses: ./.github/actions/wasm-ship-tools
      - name: every artefact built, shipped and gated (host imports, export surface, default = full)
        run: scripts/build-wasm.sh "$RUNNER_TEMP/wasm"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: artefact sizes (raw, wasm-opt -Oz, gzip -9, brotli -q 11)
        run: column -t -N artefact,raw,opt,gzip,brotli "$RUNNER_TEMP/wasm/sizes.txt"
      - name: the schema snapshot is current
        run: |
          cargo run -q -p cdoc-pm --example emit_schema | diff - schema/prosemirror-schema.json
