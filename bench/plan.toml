# How often each metric runs: `warmup` untimed runs, then `iterations` timed ones. Ours are keyed
# by metric name, competitors by `tool/metric`. No defaults: a key without an entry stops the run
# naming it. Larger documents run fewer iterations so the bench job stays under 20 minutes.

# Ours.

[plan."docx_open/1p"]
warmup = 20
iterations = 200

[plan."docx_open/10p"]
warmup = 10
iterations = 100

[plan."docx_open/100p"]
warmup = 3
iterations = 30

[plan."docx_open/500p"]
warmup = 2
iterations = 10

