# How often each metric runs: `warmup` untimed runs, then `iterations` timed ones. Ours are keyed
# by metric name, competitors by `tool/metric`. No defaults: a key without an entry stops the run
# naming it. Small documents run many iterations after a long warmup: a few hundred microseconds
# of warmup does not settle a shared runner's CPU, and the first run's 1-page numbers swung by half.
# Larger documents run fewer iterations so the bench job stays under 20 minutes.

# Ours.

[plan."docx_open/1p"]
warmup = 200
iterations = 1000

[plan."docx_open/10p"]
warmup = 50
iterations = 300

[plan."docx_open/100p"]
warmup = 3
iterations = 30

[plan."docx_open/500p"]
warmup = 2
iterations = 10

