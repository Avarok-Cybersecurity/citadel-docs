<!doctype html>
<!-- The minimal integration: ONLYOFFICE's DocsAPI.DocEditor embed, filling the viewport, the
     document fetched by the Document Server from server.ts. Defaults everywhere except the
     language (English, so the page-count label reads "Page N of M"). Rendered by server.ts. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cdoc-bench ONLYOFFICE host</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #editor { height: 100%; }
    </style>
    <script src="__DS_URL__/web-apps/apps/api/documents/api.js"></script>
  </head>
  <body>
    <div id="editor"></div>
    <script>
      // Returns the start: epoch milliseconds, taken in the page before the import begins.
      window.cdocOpen = function (file, key) {
        var start = performance.timeOrigin + performance.now();
        window.cdocEditor = new DocsAPI.DocEditor("editor", {
          documentType: "word",
          type: "desktop",
          width: "100%",
          height: "100%",
          document: { fileType: "docx", key: key, title: file, url: "__DOC_BASE__/corpus/" + file },
          editorConfig: { mode: "edit", lang: "en", callbackUrl: "__DOC_BASE__/callback" },
        });
        return start;
      };
    </script>
  </body>
</html>
