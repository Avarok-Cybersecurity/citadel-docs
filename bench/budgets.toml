# The budget of every metric of ours, from measured runs on the GitHub ubuntu-latest runner.
# `stat` is what is limited (p95_ns, median_ns or bytes), `limit` the measured value, and
# `tolerance_bp` the allowed excess in basis points (2000 = 20 %). `ceiling`, where present, is an
# owner's hard limit that no tolerance stretches. No defaults: a metric without an entry fails the
# gate with "no budget for <metric>", and an entry without a metric fails it too.
#
# Limits are the largest value of four runs (commits 95b0d6e and 7a51428) on the three CPU models
# the pool gave us (AMD EPYC 7763, Intel Xeon Platinum 8573C, AMD EPYC 9V45); the 7763 is the
# slowest and sets nearly every limit. Timings are budgeted on the median (stable on a shared
# runner); layout_keystroke on its p95, the owner's rule, with the owner's 8 ms ceiling on
# 100 pages.

[budget."crdt_from_model/1p"]
stat = "median_ns"
limit = 41498
tolerance_bp = 2000

