# The budget of every metric of ours, from measured runs on the GitHub ubuntu-latest runner.
# `stat` is what is limited (median_ns, p95_ns or bytes), `limit` the measured value, and
# `tolerance_bp` the allowed excess in basis points (2000 = 20 %). `ceiling`, where present, is an
# owner's hard limit on its own stat that no tolerance stretches. No defaults: a metric without an
# entry fails the gate with "no budget for <metric>", and an entry without a metric fails it too.
#
# Limits are the largest median of five runs (commits 95b0d6e, 7a51428 and 23a3ac5) on the three
# CPU models the runner pool gave us (AMD EPYC 7763, Intel Xeon Platinum 8573C, AMD EPYC 9V45);
# the 7763 is the slowest and sets nearly every limit. Regressions are caught on the median: on a
# shared two-vCPU runner the p95 has a noisy tail (keystroke on 100 pages: median 41 us, p95 from
# 44 to 65 us on unchanged code). The owner's keystroke rule, p95 under 8 ms on 100 pages, is the
# ceiling on that metric.
#
# Shaped text and Knuth-Plass (#20) re-based the layout_full, layout_keystroke, paint_encode,
# paint_decode, pdf_export and docx_to_pdf limits on a 7763 run of #20 (run 39099818715);
# a 9V74 run scaled by 1.35 had projected them within 13 %.


# The runner (crate::runner). `reference_ns`: the reference workload's median on the runner, from
# PR #37's bench run (AMD EPYC 9V74, 2 vCPU, commit 9ba0245: 1 765 822 ns); that run's own
# timings sat at 0.8-1.1 x the budget limits below, so it is a runner at the budgets' speed.
# `slow_factor_bp`: a run whose reference is more than 1.25 x that has its budget overruns
# reported, not gated (competitor comparisons and owner ceilings still gate). `floor_ns`: the least
# slack of a timed budget, so a few-hundred-nanosecond median cannot fail on tens of nanoseconds
# of runner noise (it changes nothing for limits above floor_ns / tolerance = 500 ns at 20 %).
[runner]
reference_ns = 1765822
slow_factor_bp = 12500
floor_ns = 100

# The largest median of two runner runs (Xeon 8370C, EPYC 9V74).
[budget."crdt_diff/after_1_keystroke_in_1MB_doc"]
stat = "median_ns"
limit = 691
tolerance_bp = 2000

# Sync sizes are deterministic (fixed seeds, no clock), so their limit is the exact size with
# no tolerance: any growth of the wire format fails the gate.
[budget."crdt_diff_bytes/after_1_block_field_change"]
