[workspace]
resolver = "2"
members = [
    "crates/cdoc-model",
    "crates/cdoc-pm",
    "crates/cdoc-layout",
    "crates/cdoc-para",
    "crates/cdoc-pdf",
    "crates/cdoc-docx",
    "crates/cdoc-md",
    "crates/cdoc-txt",
    "crates/cdoc-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/citadel-docs"
authors = ["Avarok Cybersecurity"]

[workspace.dependencies]
cdoc-model = { path = "crates/cdoc-model", version = "0.1.0" }
cdoc-pm = { path = "crates/cdoc-pm", version = "0.1.0" }
cdoc-layout = { path = "crates/cdoc-layout", version = "0.1.0" }
cdoc-para = { path = "crates/cdoc-para", version = "0.1.0" }
cdoc-pdf = { path = "crates/cdoc-pdf", version = "0.1.0" }
cdoc-docx = { path = "crates/cdoc-docx", version = "0.1.0" }
cdoc-md = { path = "crates/cdoc-md", version = "0.1.0" }
cdoc-txt = { path = "crates/cdoc-txt", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.7", default-features = false }
wasm-bindgen = "0.2"
# Font parsing and metrics: pure Rust, no allocation-heavy shaping.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
