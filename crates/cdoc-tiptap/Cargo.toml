[package]
name = "cdoc-tiptap"
description = "The old chat editor's TipTap StarterKit JSON into the Citadel Docs model, with a loss report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cdoc-model = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
proptest = { workspace = true, optional = true }

[features]
# The chat-document corpus and proptest strategies of StarterKit trees, for this crate's tests
# and the migration tests in cdoc-wasm.
test-support = ["dep:proptest"]

[dev-dependencies]
# Self dev-dependency so the integration tests see the test-support feature.
cdoc-tiptap = { path = ".", features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true
