[package]
name = "cdoc-layout"
description = "Citadel Docs layout: pagination and line breaking from the model to a page IR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The shipped default faces and hyphenation patterns compiled in, for tests in this and dependent crates. Never enabled
# by production code: the UI hands faces in through the font port.
test-support = ["cdoc-para/test-support"]

[dependencies]
cdoc-model = { workspace = true }
# Every run is shaped (ligatures, kerning, marks) and every paragraph broken by these.
cdoc-shape = { workspace = true }
cdoc-para = { workspace = true }
thiserror = { workspace = true }
ttf-parser = { workspace = true }

[dev-dependencies]
cdoc-model = { workspace = true, features = ["test-support"] }
cdoc-layout = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
# Benchmarks only; never part of a build that ships.
criterion = { workspace = true }

[[bench]]
name = "relayout"
harness = false

[lints]
workspace = true
