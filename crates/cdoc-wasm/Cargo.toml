[package]
name = "cdoc-wasm"
description = "wasm-bindgen facade over cdoc-model, cdoc-pm, the renderers and the editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
cdoc-model = { workspace = true, features = ["test-support"] }
cdoc-layout = { workspace = true, features = ["test-support"] }
lopdf = { version = "0.44", default-features = false }

[dependencies]
cdoc-crdt = { workspace = true }
cdoc-docx = { workspace = true }
cdoc-edit = { workspace = true }
cdoc-md = { workspace = true }
cdoc-odt = { workspace = true }
cdoc-model = { workspace = true }
cdoc-pm = { workspace = true }
cdoc-layout = { workspace = true }
cdoc-paint = { workspace = true }
cdoc-pdf = { workspace = true }
cdoc-txt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
