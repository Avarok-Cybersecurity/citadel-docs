[package]
name = "cdoc-docx"
description = "OOXML (.docx) reader and writer for the Citadel Docs model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cdoc-model = { workspace = true }
cdoc-pkg = { workspace = true }

[dev-dependencies]
cdoc-md = { workspace = true }
cdoc-model = { workspace = true, features = ["test-support"] }
cdoc-pkg = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
serde_json = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
