[package]
name = "cdoc-pdf"
description = "Citadel Docs PDF and SVG backends over the layout IR, and the PDF reading and incremental-update base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cdoc-model = { workspace = true }
cdoc-layout = { workspace = true }
thiserror = { workspace = true }
ttf-parser = { workspace = true }
# The PDF writer ARCHITECTURE.md names: pure Rust, four tiny dependencies. printpdf (rMazing's)
# pulls getrandom, rand and time into the wasm32 build, which the dependency gate forbids.
pdf-writer = "0.15"
# Font subsetting built for PDF embedding (typst's), pure Rust.
subsetter = "0.2.6"
# Compression of content, font and image streams.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# PNG decoding, so a PNG's alpha becomes an SMask; JPEG passes through untouched.
png = { version = "0.18", default-features = false }
# The SVG preview carries image bytes as data URIs, as rMazing's does.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Reading existing PDFs: pure Rust, no randomness or clock (lopdf has both, non-optional).
hayro-syntax = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
cdoc-model = { workspace = true, features = ["test-support"] }
cdoc-layout = { workspace = true, features = ["test-support"] }
# An independent reader for this crate's own output. A writer checked only against its own
# reader agrees with itself. Never in a shipped build.
lopdf = { version = "0.44", default-features = false }
ttf-parser = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[lints]
workspace = true
